name: Python CI with Selenoid

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      selenoid:
        image: aerokube/selenoid:1.10.7
        ports:
          - "4444:4444"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "${{ github.workspace }}/config/selenoid:/etc/selenoid"
        env:
          OVERRIDE_HOME: /etc/selenoid
        options: >-
          --health-cmd "wget -q -O - http://localhost:4444/status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate config
        run: |
          echo "Workspace: ${{ github.workspace }}"
          ls -la config/selenoid
          if [ ! -f "config/selenoid/browsers.json" ]; then
            echo "❌ browsers.json file missing!"
            exit 1
          fi

      - name: Pull browser images
        run: |
          docker pull selenoid/chrome:128.0
          docker pull selenoid/video-recorder:latest

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Selenoid
        run: |
          echo "Waiting for Selenoid to start..."
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep -q '"total":1'; then
              echo "Selenoid ready!"
              exit 0
            fi
            sleep 1
            echo -n "."
          done
          echo "Selenoid failed to start!"
          exit 1

      - name: Run tests
        env:
          SELENOID_URI: "http://localhost:4444/wd/hub"
        run: |
          python -m pytest -v tests/ --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.xml

      - name: Show Selenoid logs if failed
        if: failure()
        run: docker logs $(docker ps -aqf "name=selenoid")