version: '3.8'

services:
  selenoid:
    image: aerokube/selenoid:latest-release
    ports:
      - "4444:4444"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./config/selenoid:/etc/selenoid"
    environment:
      OVERRIDE_HOME: /etc/selenoid
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-tests:
    image: python:3.10-slim
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      selenoid:
        condition: service_healthy
    environment:
      SELENOID_URI: "http://selenoid:4444/wd/hub"
    command: >
      sh -c "pip install -r requirements.txt &&
             pytest -v tests/"