# УДАЛИТЬ ВЕРСИЮ ИЛИ ОБНОВИТЬ
services:
  selenoid:
    image: aerokube/selenoid:1.10.7
    ports:
      - "4444:4444"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./config/selenoid:/etc/selenoid"
    environment:
      OVERRIDE_HOME: /etc/selenoid
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ДОБАВЬТЕ СЕРВИС ДЛЯ ТЕСТОВ
  test-runner:
    image: python:3.10-alpine
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      selenoid:
        condition: service_healthy
    environment:
      SELENOID_URI: "http://selenoid:4444/wd/hub"
    command: >
      sh -c "pip install -r requirements.txt &&
             pytest -v tests/ --alluredir=allure-results"